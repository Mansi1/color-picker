<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Affinity-Style Color Picker</title>

  <link rel="stylesheet" href="dist/color-picker.css">
  <script src="dist/color-picker.js"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 50px;
      background-color: #222; /* Dark UI like Affinity */
      color: white;
    }

    #color-output {
      margin-top: 20px;
      padding: 10px 20px;
      border-radius: 6px;
      background: #ff0000;
      color: white;
      font-weight: bold;
      text-shadow: 0px 1px 2px rgba(0,0,0,0.5);
    }

    #hex-input {
      margin-top: 14px;
      width: 120px;
      padding: 8px 10px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #333;
      color: white;
      font: inherit;
      text-align: center;
      text-transform: uppercase;
    }

    #readout {
      margin-top: 10px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div id="my-color-picker"></div>

  <input id="hex-input" value="#ff0000" spellcheck="false" aria-label="Hex color">
  <div id="color-output">#ff0000</div>
  <div id="readout"></div>

  <script>
    var output = document.getElementById('color-output');
    var hexInput = document.getElementById('hex-input');
    var readout = document.getElementById('readout');

    var colorWheel = new ColorPicker({
      appendTo: document.getElementById('my-color-picker'),
      hex: '#ff0000',
      wheelDiameter: 140,
      wheelThickness: 12,
      handleDiameter: 8,

      onChange: function (color) {
        var hex = color.hex;
        var rgb = color.rgb;
        var hsv = color.hsv;

        output.textContent = hex;
        output.style.backgroundColor = hex;
        // Flip the label to dark text once the swatch gets bright.
        output.style.color = hsv[2] > 65 && hsv[1] < 70 ? '#111' : '#fff';

        if (document.activeElement !== hexInput) hexInput.value = hex;

        readout.textContent =
          'rgb(' + rgb.join(', ') + ')  ·  hsv(' +
          Math.round(hsv[0]) + '°, ' + Math.round(hsv[1]) + '%, ' + Math.round(hsv[2]) + '%)';
      }
    });

    // Typing a hex code drives the wheel.
    hexInput.addEventListener('input', function () {
      colorWheel.hex = hexInput.value;
    });

    // Paint the initial readout (onChange only fires on an actual change).
    colorWheel.onChange(colorWheel);
  </script>

</body>
</html>
